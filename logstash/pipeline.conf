# ═══════════════════════════════════════════════════════════
# LOGSTASH PIPELINE FOR ECOMMERCE ELK
#
# INPUT:  Read JSON log files from service containers
# FILTER: Parse JSON, validate fields, enrich
# OUTPUT: Send to Elasticsearch, index by service
# ═══════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────
# INPUT: Read logs from service files
# ─────────────────────────────────────────────────────────
input {
  # Auth Service logs
  file {
    path => "/logs/auth-service/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb-auth"
    codec => json
    type => "auth"
  }

  # Order Service logs
  file {
    path => "/logs/order-service/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb-order"
    codec => json
    type => "order"
  }

  # Notification Service logs
  file {
    path => "/logs/notification-service/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb-notification"
    codec => json
    type => "notification"
  }
}

# ─────────────────────────────────────────────────────────
# FILTER: Parse, enrich, validate logs
# ─────────────────────────────────────────────────────────
filter {
  # Logs are already in JSON format from Winston,
  # so minimal filtering needed here.
  # Just ensure the service field exists for routing.
  if ![service] {
    if [type] {
      mutate {
        add_field => { "service" => "%{[type]}" }
      }
    } else {
      mutate {
        add_field => { "service" => "unknown" }
      }
    }
  }

  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

# ─────────────────────────────────────────────────────────
# OUTPUT: Send to Elasticsearch
# ─────────────────────────────────────────────────────────
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{service}-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
