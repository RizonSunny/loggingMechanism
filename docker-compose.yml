
services:
  frontend:
    build:
      context: .
      dockerfile: public/Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    restart: on-failure
    networks:
      - ecommerce-network
    depends_on:
      - auth-service
      - order-service
      - notification-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    restart: on-failure
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
    restart: on-failure
    networks:
      - ecommerce-network
    depends_on:
      - auth-service

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
    restart: on-failure
    networks:
      - ecommerce-network
    depends_on:
      - auth-service
      - order-service

networks:
  ecommerce-network:
    driver: bridge
