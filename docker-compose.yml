
services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - ecommerce-network
    logging:
      driver: "none"

  frontend:
    build:
      context: .
      dockerfile: public/Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    restart: on-failure
    networks:
      - ecommerce-network
    depends_on:
      - auth-service
      - order-service
      - notification-service
    # ── Part 5: Docker log driver with rotation ──────────────
    # Docker captures everything written to stdout/stderr.
    # Without max-size, this grows unbounded on the host disk.
    # json-file is Docker's default driver — we just add limits.
    logging:
      driver: json-file
      options:
        max-size: "10m"   # Rotate when the Docker log hits 10MB
        max-file: "3"     # Keep at most 3 rotated files (30MB max per container)

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
    restart: on-failure
    networks:
      - ecommerce-network
    # ── Part 5: Docker log rotation ──────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ── Part 5: Persist application log files across restarts ─
    # Winston writes to ./logs/ inside the container.
    # This volume mounts it to the host so logs survive container recreation.
    volumes:
      - auth-logs:/app/logs

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - auth-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
    restart: on-failure
    networks:
      - ecommerce-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - order-logs:/app/logs

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
    restart: on-failure
    networks:
      - ecommerce-network
    depends_on:
      - mongodb
      - auth-service
      - order-service
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - notification-logs:/app/logs

# ── Part 5: Named volumes for log persistence ──────────────
# Named volumes persist across `docker-compose down` and `up`.
# Docker manages their location on the host (typically /var/lib/docker/volumes/).
# To inspect: docker volume inspect ecommerce-logging_auth-logs
volumes:
  auth-logs:
  order-logs:
  notification-logs:

networks:
  ecommerce-network:
    driver: bridge
